# Erzeugt eine neue Version auf GitHub Releases, sobald ein Tag wie v1.0.0 gepusht wird:
# bauen und testen, veröffentlichen (win-x64, eigenständig), mit Velopack Setup, portable ZIP und Update-Pakete
# erzeugen und alles als Release hochladen. Das installierte Programm findet die neue Version dort selbst.
name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: write

env:
  VPK_VERSION: 0.0.1298   # wie das Paket Velopack in Directory.Packages.props

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Version aus dem Tag
        id: version
        shell: pwsh
        run: echo "version=$('${{ github.ref_name }}'.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Bauen und testen
        run: |
          dotnet build AndiGenerator.slnx -c Release -nologo -p:Version=${{ steps.version.outputs.version }}
          dotnet test AndiGenerator.slnx -c Release --no-build -nologo

      - name: Veröffentlichen
        run: dotnet publish src/AndiGenerator.Desktop -c Release -r win-x64 --self-contained -nologo -o publish -p:Version=${{ steps.version.outputs.version }}

      - name: Velopack installieren
        run: dotnet tool install -g vpk --version ${{ env.VPK_VERSION }}

      - name: Vorige Version für Delta-Updates holen
        continue-on-error: true
        run: vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}

      - name: Pakete erzeugen
        run: >
          vpk pack --packId AndiGenerator.NET --packVersion ${{ steps.version.outputs.version }}
          --packDir publish --mainExe AndiGenerator.NET.exe --packTitle "AndiGenerator.NET"
          --packAuthors "Peter Buchmann" --icon src/AndiGenerator.UI/Assets/AndiGenerator.NET.ico

      - name: Auf GitHub Releases hochladen
        run: >
          vpk upload github --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }} --publish
          --releaseName "AndiGenerator.NET ${{ steps.version.outputs.version }}" --tag ${{ github.ref_name }}
