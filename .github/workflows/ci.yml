# Baut die Solution und führt alle Tests aus – bei jedem Push und Pull Request.
# Warnungen (auch StyleCop und SonarAnalyzer) gelten als Fehler, siehe Directory.Build.props.
name: Build und Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Bauen
        run: dotnet build AndiGenerator.slnx -c Release -nologo

      - name: Testen (mit Messung der Testabdeckung)
        run: dotnet test AndiGenerator.slnx -c Release --no-build -nologo --logger "trx" --results-directory TestResults --settings .runsettings --collect "Code Coverage;Format=cobertura"

      - name: Testabdeckung zusammenfassen
        if: always()
        shell: pwsh
        run: ./tools/abdeckung/zusammenfassen.ps1 -Ordner TestResults -Ausgabe $env:GITHUB_STEP_SUMMARY

      - name: Testergebnisse aufheben
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: testergebnisse
          path: |
            TestResults/**/*.trx
            TestResults/**/*.cobertura.xml
