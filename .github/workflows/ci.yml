# Baut die Solution und führt alle Tests aus – bei jedem Push und Pull Request.
# Warnungen (auch StyleCop und SonarAnalyzer) gelten als Fehler, siehe Directory.Build.props.
name: Build und Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Bauen
        run: dotnet build AndiGenerator.slnx -c Release -nologo

      - name: Testen
        run: dotnet test AndiGenerator.slnx -c Release --no-build -nologo --logger "trx" --results-directory TestResults

      - name: Testergebnisse aufheben
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testergebnisse
          path: TestResults/*.trx
